global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/signalnest-alerts.yml

scrape_configs:
  - job_name: signalnest-api
    metrics_path: /api/metrics
    static_configs:
      - targets:
          - api:4040

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121
